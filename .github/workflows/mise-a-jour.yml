name: Mise à jour de la prévision

on:
  schedule:
    - cron: "0 5 * * 1"   # chaque lundi à 5 h UTC (5 h à Abidjan)
  workflow_dispatch:       # bouton « Run workflow » pour lancer à la main
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  prevision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Mettre à jour pluie, météo et prévision (bilan hydrique riz)
        if: github.event_name != 'push'
        id: calcul
        continue-on-error: true   # en cas de panne d'un serveur, on garde la prévision précédente
        working-directory: scripts
        env:
          OUTDIR: ../docs
        run: |
          for essai in 1 2 3; do
            python donnees_bilan.py && break
            echo "Échec de l'essai $essai, nouvel essai dans 120 s"; sleep 120
          done
          python fenetres_riz.py
          CULTURE=mais python fenetres_riz.py
          CULTURE=arachide python fenetres_riz.py
          CULTURE=igname python fenetres_riz.py

      - name: Enregistrer les nouvelles données
        if: github.event_name != 'push' && steps.calcul.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/*.json scripts/cache_bilan
          git diff --cached --quiet || git commit -m "Prévision du $(python -c "import json;print(json.load(open('docs/prevision_riz_derniere.json'))['date_prevision'])") (bilan hydrique riz)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  publication:
    needs: prevision
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
